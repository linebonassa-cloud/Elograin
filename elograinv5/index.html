<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1B4D3E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Elograin - SuperApp para comunidade vegana">
  <title>Elograin</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Bibliotecas de animação (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/motion@10.18.0/dist/motion.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Swipe to Delete Confirmation Overlay -->
  <div class="swipe-overlay" id="swipeOverlay">
    <div class="swipe-modal">
      <div class="warning-icon">🗑️</div>
      <h3>Excluir post?</h3>
      <p id="swipePostTitle">Esta acao nao pode ser desfeita.</p>

      <div class="swipe-track" id="swipeTrack">
        <div class="swipe-progress" id="swipeProgress"></div>
        <div class="swipe-track-inner">
          <span class="swipe-label" id="swipeLabel">Arraste para excluir →</span>
          <span class="swipe-success" id="swipeSuccess">
            ✅ Excluindo...
          </span>
        </div>
        <div class="swipe-handle" id="swipeHandle">
          🗑️
        </div>
      </div>

      <button class="swipe-cancel" id="swipeCancel" onclick="closeSwipeModal()">Cancelar</button>
    </div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="logo">
      <div class="logo-icon">🌿</div>
      <span>Elograin</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Alternar tema">🌙</button>
      <button class="icon-btn" id="notifBtn" aria-label="Notificacoes">🔔</button>
    </div>
  </header>

  <!-- Main Content -->
  <main id="mainContent">
    <!-- FEED -->
    <section class="view active" id="feedView">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="feedSearch" placeholder="Buscar na comunidade...">
      </div>
      <div class="tag-list" id="feedTags">
        <button class="tag active" data-tag="todos">Todos</button>
        <button class="tag" data-tag="dica">💡 Dicas</button>
        <button class="tag" data-tag="experiencia">✨ Experiencias</button>
        <button class="tag" data-tag="duvida">❓ Duvidas</button>
      </div>
      <!-- Skeleton Feed -->
      <div id="feedSkeleton">
        <div class="skeleton-card">
          <div class="skeleton-header">
            <div class="skeleton skeleton-avatar"></div>
            <div style="flex:1">
              <div class="skeleton skeleton-line skeleton-line-sm"></div>
              <div class="skeleton skeleton-line skeleton-line-md"></div>
            </div>
          </div>
          <div class="skeleton skeleton-img"></div>
          <div class="skeleton skeleton-line skeleton-line-lg"></div>
          <div class="skeleton skeleton-line skeleton-line-md"></div>
          <div class="skeleton-actions">
            <div class="skeleton skeleton-action"></div>
            <div class="skeleton skeleton-action"></div>
            <div class="skeleton skeleton-action"></div>
          </div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-header">
            <div class="skeleton skeleton-avatar"></div>
            <div style="flex:1">
              <div class="skeleton skeleton-line skeleton-line-sm"></div>
              <div class="skeleton skeleton-line skeleton-line-md"></div>
            </div>
          </div>
          <div class="skeleton skeleton-img"></div>
          <div class="skeleton skeleton-line skeleton-line-lg"></div>
          <div class="skeleton skeleton-line skeleton-line-md"></div>
          <div class="skeleton-actions">
            <div class="skeleton skeleton-action"></div>
            <div class="skeleton skeleton-action"></div>
            <div class="skeleton skeleton-action"></div>
          </div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-header">
            <div class="skeleton skeleton-avatar"></div>
            <div style="flex:1">
              <div class="skeleton skeleton-line skeleton-line-sm"></div>
              <div class="skeleton skeleton-line skeleton-line-md"></div>
            </div>
          </div>
          <div class="skeleton skeleton-img"></div>
          <div class="skeleton skeleton-line skeleton-line-lg"></div>
          <div class="skeleton skeleton-line skeleton-line-md"></div>
          <div class="skeleton-actions">
            <div class="skeleton skeleton-action"></div>
            <div class="skeleton skeleton-action"></div>
            <div class="skeleton skeleton-action"></div>
          </div>
        </div>
      </div>
      <div id="feedPosts" class="hidden"></div>
    </section>

    <!-- RECIPES -->
    <section class="view" id="recipesView">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="recipeSearch" placeholder="Buscar receitas veganas...">
      </div>
      <div class="tabs" id="recipeTabs">
        <button class="tab active" data-tab="todas">Todas</button>
        <button class="tab" data-tab="economica">💰 Economicas</button>
        <button class="tab" data-tab="rapida">⚡ Rapidas</button>
        <button class="tab" data-tab="sobremesa">🍰 Sobremesas</button>
      </div>
      <div id="recipesSkeleton">
        <div class="skeleton-recipe">
          <div class="skeleton skeleton-thumb"></div>
          <div style="flex:1">
            <div class="skeleton skeleton-line skeleton-line-title"></div>
            <div class="skeleton skeleton-line skeleton-line-md"></div>
            <div class="skeleton skeleton-line skeleton-line-sm"></div>
          </div>
        </div>
        <div class="skeleton-recipe">
          <div class="skeleton skeleton-thumb"></div>
          <div style="flex:1">
            <div class="skeleton skeleton-line skeleton-line-title"></div>
            <div class="skeleton skeleton-line skeleton-line-md"></div>
            <div class="skeleton skeleton-line skeleton-line-sm"></div>
          </div>
        </div>
        <div class="skeleton-recipe">
          <div class="skeleton skeleton-thumb"></div>
          <div style="flex:1">
            <div class="skeleton skeleton-line skeleton-line-title"></div>
            <div class="skeleton skeleton-line skeleton-line-md"></div>
            <div class="skeleton skeleton-line skeleton-line-sm"></div>
          </div>
        </div>
      </div>
      <div id="recipesList" class="hidden"></div>
    </section>

    <!-- EXPLORE -->
    <section class="view" id="exploreView">
      <div class="tabs" id="exploreTabs">
        <button class="tab active" data-tab="mapa">🗺️ Mapa</button>
        <button class="tab" data-tab="eventos">🎉 Eventos</button>
        <button class="tab" data-tab="avaliacoes">⭐ Avaliacoes</button>
      </div>
      <div id="exploreContent">
        <div id="exploreSkeleton">
          <div class="skeleton" style="width:100%;height:320px;border-radius:16px;margin-bottom:16px"></div>
          <div class="skeleton-place">
            <div class="skeleton skeleton-place-img"></div>
            <div style="flex:1">
              <div class="skeleton skeleton-line skeleton-line-title"></div>
              <div class="skeleton skeleton-line skeleton-line-md"></div>
              <div class="skeleton skeleton-line skeleton-line-sm"></div>
            </div>
          </div>
          <div class="skeleton-place">
            <div class="skeleton skeleton-place-img"></div>
            <div style="flex:1">
              <div class="skeleton skeleton-line skeleton-line-title"></div>
              <div class="skeleton skeleton-line skeleton-line-md"></div>
              <div class="skeleton skeleton-line skeleton-line-sm"></div>
            </div>
          </div>
        </div>
        <div id="exploreRealContent" class="hidden"></div>
      </div>
    </section>

    <!-- CONSUME -->
    <section class="view" id="consumeView">
      <div class="tabs" id="consumeTabs">
        <button class="tab active" data-tab="mercado">🛒 Mercado</button>
        <button class="tab" data-tab="beleza">💄 Beleza</button>
      </div>
      <div id="consumeContent"></div>
    </section>

    <!-- CONNECT -->
    <section class="view" id="connectView">
      <div class="tabs" id="connectTabs">
        <button class="tab active" data-tab="encontros">💕 Encontros</button>
        <button class="tab" data-tab="amizades">🤝 Amizades</button>
      </div>
      <div id="connectContent"></div>
    </section>

    <!-- PROFILE -->
    <section class="view" id="profileView">
      <div class="card profile-card">
        <div class="avatar avatar-lg" id="profileAvatar">🦁</div>
        <h2 id="profileName">Voce</h2>
        <p style="color: var(--text-light); font-size: 0.9rem;" id="profileBio">Membro da comunidade Elograin</p>
        <div class="profile-stats">
          <div class="profile-stat"><div class="num" id="statPosts">0</div><div class="lbl">Posts</div></div>
          <div class="profile-stat"><div class="num" id="statRecipes">0</div><div class="lbl">Receitas</div></div>
          <div class="profile-stat"><div class="num" id="statLikes">0</div><div class="lbl">Curtidas</div></div>
        </div>
      </div>
      <h3 class="section-title mb-1">Minhas Receitas</h3>
      <div id="myRecipes"></div>
      <h3 class="section-title mb-1 mt-2">Minhas Avaliacoes</h3>
      <div id="myReviews"></div>
    </section>
  </main>

  <!-- FAB -->
  <button class="fab pulse" id="fabBtn" aria-label="Criar">✚</button>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-item active" data-view="feed">
        <span class="nav-icon">🏠</span>
        <span>Inicio</span>
      </button>
      <button class="nav-item" data-view="recipes">
        <span class="nav-icon">🍽️</span>
        <span>Receitas</span>
      </button>
      <button class="nav-item" data-view="explore">
        <span class="nav-icon">🗺️</span>
        <span>Explorar</span>
      </button>
      <button class="nav-item" data-view="consume">
        <span class="nav-icon">🛒</span>
        <span>Consumo</span>
      </button>
      <button class="nav-item" data-view="connect">
        <span class="nav-icon">💕</span>
        <span>Conexoes</span>
      </button>
    </div>
  </nav>

  <!-- Create Modal -->
  <div class="modal-overlay" id="createModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Criar Novo</h3>
        <button class="icon-btn" id="closeCreateModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="tabs" id="createTabs">
          <button class="tab active" data-create="post">📝 Post</button>
          <button class="tab" data-create="recipe">🍽️ Receita</button>
          <button class="tab" data-create="review">⭐ Avaliacao</button>
        </div>
        <div id="createForm"></div>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="detailTitle">Detalhes</h3>
        <button class="icon-btn" id="closeDetailModal">✕</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
      <div class="modal-footer" id="detailFooter"></div>
    </div>
  </div>

  /* ---------- CORAÇÃO ----------
     Camadas: (1) contorno cinza fixo, (2) preenchimento vermelho (opacity 0),
     (3) contorno vermelho revelado por um clipPath cuja largura cresce 0 → 24.
     É esse retângulo que faz o "traço" avançar da esquerda para a direita. */
  function heartHTML(id, liked) {
    return '<span class="heart-wrap"><svg class="heart" viewBox="0 0 24 24" aria-hidden="true">' +
      '<defs><clipPath id="hc-' + id + '"><rect x="0" y="0" width="' + (liked ? 24 : 0) + '" height="24"/></clipPath></defs>' +
      '<path class="h-ghost" d="' + HEART + '"/>' +
      '<path class="h-fill" d="' + HEART + '" style="opacity:' + (liked ? 1 : 0) + '"/>' +
      '<g clip-path="url(#hc-' + id + ')"><path class="h-stroke" d="' + HEART + '"/></g></svg></span>';
  }

  // Anima o coração para o estado "curtido" (true) ou "normal" (false)
  function setHeart(btn, liked) {
    var wrap = btn.querySelector('.heart-wrap'), rect = btn.querySelector('rect'), fill = btn.querySelector('.h-fill');
    var token = btn._t = (btn._t || 0) + 1;             // cancela animação anterior se o usuário clicar rápido
    var setW = function (w) { rect.setAttribute('width', w); };
    if (!animate) { setW(liked ? 24 : 0); fill.style.opacity = liked ? 1 : 0; return; }
    if (liked) {
      setW(0); fill.style.opacity = 0;
      // 1) Traço desenhado da esquerda para a direita (progress vai de 0 a 1)
      animate(function (p) { setW(24 * p); }, { duration: D(0.55), easing: 'ease-in-out' }).finished.then(function () {
        if (btn._t !== token) return;
        // 2) Contorno completo → preenche com cor vibrante
        animate(fill, { opacity: 1 }, { duration: D(0.12) });
        // 3) Pulso de impacto: cresce, encolhe um pouco e assenta
        animate(wrap, { scale: [1, 1.4, 0.92, 1] }, { duration: D(0.5), easing: 'ease-out' });
      });
    } else {
      // Desfazer: esvazia o preenchimento e recolhe o traço suavemente (direita → esquerda)
      animate(fill, { opacity: 0 }, { duration: D(0.2) });
      animate(wrap, { scale: [1, 0.85, 1] }, { duration: D(0.3) });
      animate(function (p) { setW(24 * (1 - p)); }, { duration: D(0.3), easing: 'ease-in' });
    }
  }

  /* ---------- ESTRELAS ----------
     mountRating(container, { initial, confirm, noun, onChange, onConfirm }) */
  function mountRating(box, o) {
    if (!box) return;
    o = o || {};
    var val = o.initial || 0, done = false, needConfirm = o.confirm !== false, noun = o.noun || 'Avaliação';
    box.classList.add('rate-box');
    box.innerHTML = '<div class="stars-wrap"><div class="stars-row" role="radiogroup" aria-label="Nota de 1 a 5">' +
      [1, 2, 3, 4, 5].map(function (n) {
        return '<button type="button" class="star-b" role="radio" aria-checked="false" aria-label="' + n + ' de 5"><svg viewBox="0 0 24 24"><path d="' + STAR + '"/></svg></button>';
      }).join('') + '</div><div class="lottie-slot"></div></div>' +
      (needConfirm ? '<button type="button" class="btn btn-primary w-full rate-confirm" disabled>Confirmar nota</button>' : '') +
      '<div class="rate-result" aria-live="polite"></div>';
    var stars = [].slice.call(box.querySelectorAll('.star-b')), btn = box.querySelector('.rate-confirm'),
        slot = box.querySelector('.lottie-slot'), result = box.querySelector('.rate-result');

    // Pinta as n primeiras estrelas; as pintadas (a selecionada e todas as anteriores) crescem levemente
    function paint(n) {
      stars.forEach(function (s, i) {
        var on = i < n;
        s.classList.toggle('on', on);
        s.setAttribute('aria-checked', String(val === i + 1));
        if (s._on === on) return;
        s._on = on;
        if (animate) animate(s, { scale: on ? 1.18 : 1 }, { duration: D(0.25), easing: OVERSHOOT });
      });
    }
    stars.forEach(function (s, i) {
      s.addEventListener('pointerenter', function (e) { if (!done && e.pointerType === 'mouse') paint(i + 1); }); // hover (só mouse)
      s.addEventListener('click', function () {
        if (done) return;
        val = i + 1; paint(val);
        if (btn) btn.disabled = false;
        if (o.onChange) o.onChange(val);
      });
    });
    box.querySelector('.stars-row').addEventListener('pointerleave', function () { if (!done) paint(val); });
    paint(val);

    if (btn) btn.addEventListener('click', function () {
      if (done || !val) return;
      done = true; btn.disabled = true; box.classList.add('locked');
      var on = stars.slice(0, val);
      // Onda de pulso nas estrelas selecionadas, uma após a outra
      if (animate) animate(on, { scale: [1.18, 1.5, 1.18] }, { delay: stagger ? stagger(0.07) : 0, duration: D(0.5) });
      // Brilho Lottie por cima das estrelas (dispara uma vez)
      if (window.lottie && !reduce) {
        slot.innerHTML = '';
        lottie.loadAnimation({ container: slot, renderer: 'svg', loop: false, autoplay: true, animationData: SPARK });
      }
      // Feedback com a pontuação escolhida
      result.textContent = val.toFixed(1) + ' / 5.0 - ' + noun + ' Avaliada!';
      if (animate) animate(result, { opacity: [0, 1], transform: ['translateY(8px)', 'translateY(0)'] }, { duration: D(0.45) });
      if (o.onConfirm) o.onConfirm(val);
    });
  }
  return { heartHTML: heartHTML, setHeart: setHeart, mountRating: mountRating };
})();
