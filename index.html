<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#241A18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Elograin - SuperApp para comunidade vegana">
  <title>Elograin</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Bibliotecas de animação (CDN) -->
  <script defer src="https://cdn.jsdelivr.net/npm/motion@10.18.0/dist/motion.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script>window.addEventListener('error',function(e){if(location.hostname!=='localhost'||document.getElementById('dbgErr'))return;var d=document.createElement('div');d.id='dbgErr';d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#c0392b;color:#fff;font:12px monospace;padding:8px;word-break:break-all';d.textContent='Erro: '+(e.message||'')+' ('+String(e.filename||'').split('/').pop()+':'+e.lineno+')';document.body&&document.body.appendChild(d)});</script>
  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Swipe to Delete Confirmation Overlay -->
  <div class="swipe-overlay" id="swipeOverlay">
    <div class="swipe-modal">
      <div class="warning-icon">🗑️</div>
      <h3>Excluir post?</h3>
      <p id="swipePostTitle">Esta acao nao pode ser desfeita.</p>

      <div class="swipe-track" id="swipeTrack">
        <div class="swipe-progress" id="swipeProgress"></div>
        <div class="swipe-track-inner">
          <span class="swipe-label" id="swipeLabel">Arraste para excluir →</span>
          <span class="swipe-success" id="swipeSuccess">
            ✅ Excluindo...
          </span>
        </div>
        <div class="swipe-handle" id="swipeHandle">
          🗑️
        </div>
      </div>

      <button class="swipe-cancel" id="swipeCancel" onclick="closeSwipeModal()">Cancelar</button>
    </div>
  </div>

  <!-- Header -->
    <!-- LOGIN / CADASTRO -->
  <div id="authScreen" class="auth" hidden>
    <div class="auth-card">
      <div class="auth-logo"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="mga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0784E"/><stop offset="1" stop-color="#D99A58"/></linearGradient></defs><path d="M24 41C10 31 6 24 6 17.5 6 12.8 9.7 9 14.4 9c3.6 0 7 2.2 9.6 5.5C26.6 11.2 30 9 33.6 9 38.3 9 42 12.8 42 17.5 42 24 38 31 24 41z" fill="none" stroke="url(#mga)" stroke-width="3.4" stroke-linejoin="round"/><path d="M22.5 31c0-7.5 4.5-12 12.5-13 0 8-4.5 12.5-12.5 13z" fill="url(#mga)"/><path d="M23.5 30.5c3-3.5 6-6 9.5-8" stroke="#241A18" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg></div>
      <h1>Elo<em>grain</em></h1>
      <p class="auth-sub">Mais sabor. Mais conexões. Zero crueldade.</p>
      <div class="auth-tabs">
        <button type="button" id="tabLogin" class="on" onclick="authMode('login')">Entrar</button>
        <button type="button" id="tabSignup" onclick="authMode('signup')">Criar conta</button>
      </div>
      <form id="authForm" onsubmit="submitAuth(event)" novalidate>
        <div class="field" id="fName" hidden><label for="aName">Nome</label><input id="aName" type="text" maxlength="30" autocomplete="name" placeholder="Como quer ser chamado(a)"></div>
        <div class="field" id="fAvatar" hidden><label>Escolha seu avatar</label><div class="av-pick" id="avPick"></div></div>
        <div class="field" id="fEmail"><label for="aEmail">E-mail</label><input id="aEmail" type="email" inputmode="email" autocomplete="username" placeholder="voce@email.com"></div>
        <div class="field"><label for="aPass" id="pwLabel">Senha</label>
          <div class="pw"><input id="aPass" type="password" autocomplete="current-password" placeholder="Sua senha"><button type="button" id="pwToggle" aria-label="Mostrar senha" onclick="togglePw()">👁️</button></div>
          <small id="pwHint" hidden>Mínimo de 8 caracteres</small>
          <button type="button" class="auth-link" id="forgotLink" onclick="forgotPassword()">Esqueci minha senha</button></div>
        <p id="authErr" class="auth-err" role="alert"></p>
        <button class="btn btn-primary auth-submit" id="authBtn" type="submit">Entrar</button>
      </form>
      <p class="auth-note">🔒 Sua senha é protegida com criptografia.</p>
    </div>
  </div>

  <aside class="sidebar" aria-label="Navegação principal">
    <div class="side-brand"><div class="row"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="mgs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0784E"/><stop offset="1" stop-color="#D99A58"/></linearGradient></defs><path d="M24 41C10 31 6 24 6 17.5 6 12.8 9.7 9 14.4 9c3.6 0 7 2.2 9.6 5.5C26.6 11.2 30 9 33.6 9 38.3 9 42 12.8 42 17.5 42 24 38 31 24 41z" fill="none" stroke="url(#mgs)" stroke-width="3.4" stroke-linejoin="round"/><path d="M22.5 31c0-7.5 4.5-12 12.5-13 0 8-4.5 12.5-12.5 13z" fill="url(#mgs)"/><path d="M23.5 30.5c3-3.5 6-6 9.5-8" stroke="#241A18" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg><span class="side-name">Elo<em>grain</em></span></div><span class="slogan">Mais sabor. Mais conexões.<br>Zero crueldade.</span></div>
    <nav class="side-nav">
      <button class="side-item active" data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Início</span></button>
      <button class="side-item" data-view="explore"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v7a2.5 2.5 0 0 0 5 0V3M9.5 3v18"/><path d="M17 3c-2.2 1.8-3 4.5-3 8h3v10"/></svg><span>Restaurantes</span></button>
      <button class="side-item" data-view="recipes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M8.5 8.5c-.8-1 .8-2 0-3M12.5 8.5c-.8-1 .8-2 0-3M16.5 8.5c-.8-1 .8-2 0-3"/></svg><span>Receitas</span></button>
      <button class="side-item" data-view="consume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8.5h14l-1.1 11.5H6.1z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/></svg><span>Mercado</span></button>
      <button class="side-item" data-view="feed"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14c2.5 0 4.5 2 4.5 4.5"/></svg><span>Comunidade</span></button>
      <button class="side-item" data-view="connect"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-9.2-9.4A5 5 0 0 1 12 7.6a5 5 0 0 1 9.2 3C19.5 15.4 12 20 12 20z"/></svg><span>Conexões</span></button>
      <button class="side-item" data-view="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span>Perfil</span></button>
    </nav>
    <button class="side-create" onclick="openCreateMenu()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Criar publicação</button>
    <div class="side-foot"><button class="side-link" onclick="openSettings()"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg> Configurações</button><button class="side-link" onclick="openHelp()"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.01"/></svg> Ajuda</button><button class="side-link" onclick="logout()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg> Sair</button></div>
  </aside>
  <header class="app-header">
    <div class="logo"><div class="logo-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="mgh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0784E"/><stop offset="1" stop-color="#D99A58"/></linearGradient></defs><path d="M24 41C10 31 6 24 6 17.5 6 12.8 9.7 9 14.4 9c3.6 0 7 2.2 9.6 5.5C26.6 11.2 30 9 33.6 9 38.3 9 42 12.8 42 17.5 42 24 38 31 24 41z" fill="none" stroke="url(#mgh)" stroke-width="3.4" stroke-linejoin="round"/><path d="M22.5 31c0-7.5 4.5-12 12.5-13 0 8-4.5 12.5-12.5 13z" fill="url(#mgh)"/><path d="M23.5 30.5c3-3.5 6-6 9.5-8" stroke="#241A18" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg></div><span>Elo<em>grain</em></span><small class="ver">v7.3</small></div>
    <form class="top-search" role="search" onsubmit="globalSearch(event)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="gSearch" type="search" placeholder="Buscar por restaurantes, receitas, produtos..." aria-label="Busca global" autocomplete="off"></form>
    <div class="header-actions">
      <button class="elo-top" id="eloTop" onclick="openChat()" aria-label="Conversar com a Elo"><span aria-hidden="true">🌿</span> Elo</button>
      <button class="icon-btn" id="themeToggle" aria-label="Alternar tema">🌙</button>
      <button class="icon-btn" id="notifBtn" aria-label="Notificações"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg></button>
      <button class="icon-btn avatar-btn" id="headerAvatar" aria-label="Meu perfil" onclick="showView('profile')">🌱</button>
    </div>
  </header>

  <!-- Main Content -->
  <main id="mainContent">
    <!-- INÍCIO -->
    <section class="view active" id="homeView"><div id="homeContent"></div></section>
    <!-- COMUNIDADE (feed) -->
    <section class="view" id="feedView">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="feedSearch" placeholder="Buscar na comunidade...">
      </div>
      <div class="tag-list" id="feedTags">
        <button class="tag active" data-tag="todos">Todos</button>
        <button class="tag" data-tag="dica">💡 Dicas</button>
        <button class="tag" data-tag="experiencia">✨ Experiências</button>
        <button class="tag" data-tag="duvida">❓ Dúvidas</button>
      </div>
      <!-- Skeleton Feed -->
      <div id="feedSkeleton">
        <div class="skeleton-card">
          <div class="skeleton-header">
            <div class="skeleton skeleton-avatar"></div>
            <div style="flex:1">
              <div class="skeleton skeleton-line skeleton-line-sm"></div>
              <div class="skeleton skeleton-line skeleton-line-md"></div>
            </div>
          </div>
          <div class="skeleton skeleton-img"></div>
          <div class="skeleton skeleton-line skeleton-line-lg"></div>
          <div class="skeleton skeleton-line skeleton-line-md"></div>
          <div class="skeleton-actions">
            <div class="skeleton skeleton-action"></div>
            <div class="skeleton skeleton-action"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="photos.js"></script>
  <script src="elo-chat.js"></script>
  <script src="app.js"></script>
</body>
</html>
