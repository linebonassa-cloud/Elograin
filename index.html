<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2E7D32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VeggieLife - Receitas Veganas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash" class="splash-screen">
    <div class="splash-content">
      <div class="splash-icon">🌿</div>
      <h1>VeggieLife</h1>
      <p>Receitas Veganas & Comunidade</p>
      <div class="splash-loader"></div>
    </div>
  </div>

  <!-- App Container -->
  <div id="app" class="app-container hidden">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <span class="header-logo">🌿 VeggieLife</span>
        <button class="header-btn" id="btn-search" aria-label="Buscar">🔍</button>
      </div>
    </header>

    <!-- Search Overlay -->
    <div id="search-overlay" class="search-overlay hidden">
      <div class="search-bar">
        <button class="search-back" id="search-back">←</button>
        <input type="text" id="search-input" placeholder="Buscar receitas ou posts...">
        <button class="search-clear" id="search-clear">✕</button>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- ABA RECEITAS -->
      <section id="tab-recipes" class="tab-content active">
        <div class="hero-section">
          <h2>🍽️ Receitas Caseiras</h2>
          <p>Delícias veganas feitas com amor</p>
        </div>

        <div class="filters-bar">
          <button class="filter-chip active" data-filter="all">Todas</button>
          <button class="filter-chip" data-filter="café">☕ Café</button>
          <button class="filter-chip" data-filter="almoço">🍛 Almoço</button>
          <button class="filter-chip" data-filter="jantar">🍝 Jantar</button>
          <button class="filter-chip" data-filter="sobremesa">🍰 Doce</button>
          <button class="filter-chip" data-filter="lanche">🥪 Lanche</button>
        </div>

        <div class="recipes-grid" id="recipes-grid"></div>
      </section>

      <!-- ABA COMUNIDADE -->
      <section id="tab-community" class="tab-content">
        <div class="hero-section community-hero">
          <h2>👥 Comunidade</h2>
          <p>Compartilhe experiências e descobertas</p>
        </div>

        <div class="posts-feed" id="posts-feed"></div>
      </section>
    </main>

    <!-- Recipe Detail Modal -->
    <div id="recipe-modal" class="modal hidden">
      <div class="modal-content">
        <button class="modal-close" id="modal-close">✕</button>
        <div id="recipe-detail"></div>
      </div>
    </div>

    <!-- New Post Modal -->
    <div id="post-modal" class="modal hidden">
      <div class="modal-content post-modal-content">
        <div class="modal-header">
          <h3>✨ Nova Postagem</h3>
          <button class="modal-close" id="post-modal-close">✕</button>
        </div>
        <form id="post-form">
          <div class="form-group">
            <label for="post-author">Seu nome</label>
            <input type="text" id="post-author" placeholder="Como quer ser chamado?" required>
          </div>
          <div class="form-group">
            <label for="post-content">O que você quer compartilhar?</label>
            <textarea id="post-content" rows="4" placeholder="Conte sua experiência, dica ou receita favorita..." required></textarea>
          </div>
          <div class="form-group">
            <label>Emoji do post</label>
            <div class="emoji-picker">
              <button type="button" class="emoji-option selected" data-emoji="🌿">🌿</button>
              <button type="button" class="emoji-option" data-emoji="🍕">🍕</button>
              <button type="button" class="emoji-option" data-emoji="🥗">🥗</button>
              <button type="button" class="emoji-option" data-emoji="🍰">🍰</button>
              <button type="button" class="emoji-option" data-emoji="🥤">🥤</button>
              <button type="button" class="emoji-option" data-emoji="🌮">🌮</button>
            </div>
          </div>
          <button type="submit" class="btn-submit">📤 Publicar</button>
        </form>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- Floating Action Button (FAB) - Thumb Friendly na parte inferior -->
    <button id="fab" class="fab" aria-label="Nova postagem">
      <span>＋</span>
    </button>

    <!-- Bottom Navigation - Thumb Friendly -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="recipes">
        <span class="nav-icon">🍽️</span>
        <span class="nav-label">Receitas</span>
      </button>
      <button class="nav-item" data-tab="community">
        <span class="nav-icon">👥</span>
        <span class="nav-label">Comunidade</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
